<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>كتالوج الخامات</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>


<div dir="rtl" lang="ar" id="app">
  <header class="top" id="topBar">
    <div class="inner">
      <div class="brand"><span class="mark" aria-hidden="true"></span><b>كتالوج الخامات</b></div>
      <div class="seg" id="adminControls" role="group" aria-label="وضع العرض" hidden>
        <button type="button" data-act="mode" data-mode="client" aria-pressed="true">العميل</button>
        <button type="button" data-act="mode" data-mode="admin" aria-pressed="false">التاجر</button>
        <button type="button" id="logoutBtn" class="logout-btn">تسجيل الخروج</button>
      </div>
    </div>
  </header>

  <main class="inner" id="catalogView">
    <section id="clientView">
      <div class="hero">
        <h1>الأقمشة المتاحة دلوقتي</h1>
        <p class="sub">اختار الخامة، شوف الصورة والسعر، وحدد الكمية.</p>
      </div>
      <input id="search" class="search" type="search" placeholder="دوّر على قماش…" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="adminView" hidden>
      <div class="hero">
        <h1>لوحة التاجر</h1>
        <p class="sub">أضف السعر والصورة والكمية المتاحة لكل خامة.</p>
      </div>
      <div class="tabs"><div class="seg" role="group" aria-label="أقسام اللوحة">
        <button type="button" data-act="tab" data-tab="orders" aria-pressed="true">الطلبات</button>
        <button type="button" data-act="tab" data-tab="stock" aria-pressed="false">المخزون</button>
      </div></div>
      <div class="panel" id="ordersPanel"></div>
      <div class="panel" id="stockPanel" hidden>
        <form class="addbox" id="addForm">
          <h3>إضافة خامة جديدة</h3>
          <div class="formgrid">
            <label class="full">اسم الخامة<input id="nf-name" required placeholder="مثال: كوريشه"></label>
            <label>سعر البيع للمتر<input id="nf-price" type="number" inputmode="decimal" min="1" required></label>
            <label>المتاح بالمتر<input id="nf-stock" type="number" inputmode="numeric" min="0" required></label>
            <label class="full">صورة الخامة<input id="nf-image" type="file" accept="image/*"></label>
          </div>
          <button class="btn block" type="submit">أضف الخامة</button>
        </form>
        <div class="panel" id="stockList"></div>
      </div>
    </section>
  </main>

  <div class="cartbar" id="cartbar" hidden>
    <div class="in">
      <div class="tot"><span class="sub" id="cartCount"></span><b id="cartTotal"></b></div>
      <button class="btn" type="button" data-act="checkout">راجع الطلب</button>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
  </div>
  <div class="toast" id="toast" hidden role="status"><span id="toastText"></span></div>
</div>



<script src="js/app.js"></script>
</body>
</html>
