<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تسجيل دخول الأدمن</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <form class="login-box" id="loginForm">
      <span class="mark" aria-hidden="true"></span>
      <h1 id="loginTitle">تسجيل دخول الأدمن</h1>
      <p class="sub" id="loginDescription">أدخل اسم المستخدم وكلمة المرور.</p>
      <label>اسم المستخدم
        <input id="loginUsername" type="text" autocomplete="username" value="admin" required>
      </label>
      <label>كلمة المرور
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn block" type="submit">دخول</button>
      <a class="sub login-back" href="index.html">العودة إلى صفحة الخامات</a>
      <p class="sub" id="loginError" aria-live="polite"></p>
    </form>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/login.js?v=20261123-destination-project"></script>
</body>
</html>
